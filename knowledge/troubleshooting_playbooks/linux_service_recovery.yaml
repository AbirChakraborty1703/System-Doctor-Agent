playbook_id: linux_service_recovery
title: Linux service dependency recovery
os: linux
risk_level: medium
warnings:
  - Package repair may update dependent components.
steps:
  - action: Inspect failing service details and dependency chain
    command: systemctl status <service>
    risk: low
    checkpoint: Root failure unit and exit code identified
    rollback: None
  - action: Review recent critical logs
    command: journalctl -xe
    risk: low
    checkpoint: Missing dependency or permission issue found
    rollback: None
  - action: Repair broken package dependencies
    command: apt --fix-broken install
    risk: medium
    checkpoint: Dependency graph resolves cleanly
    rollback: Reinstall pinned package versions if required
escalation_advice: If service remains down, escalate with unit files and log bundle.
