version: '3.9'
services:
  streamlit:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.streamlit
    ports:
      - "8501:8501"
    env_file:
      - ../../.env

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
